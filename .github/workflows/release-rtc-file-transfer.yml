name: Release rtc-file-transfer

# Push a tag like `rtc-file-transfer@v0.1.0` after bumping the version in
# packages/rtc-file-transfer/package.json and its CHANGELOG. The job publishes
# to npm, then creates the GitHub release from that version's CHANGELOG section.
on:
  push:
    tags:
      - "rtc-file-transfer@v*"

permissions:
  # Creating the GitHub release.
  contents: write
  # npm trusted publishing and provenance: no long-lived NPM_TOKEN.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # A protected environment with a required reviewer. Pushing the tag no
    # longer publishes on its own — the run waits here until a human
    # approves it, so a stolen credential that can push a tag still cannot
    # reach npm unobserved.
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(node -p "require('./packages/rtc-file-transfer/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "rtc-file-transfer@v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          # A version can be published only once. Re-running on a tag that is
          # already on npm (0.1.0 was published by hand) verifies, then stops.
          if npm view "@thebkht/rtc-file-transfer@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@thebkht/rtc-file-transfer@${version} is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: pnpm -F @thebkht/rtc-file-transfer test

      - name: Build
        run: pnpm -F @thebkht/rtc-file-transfer build

      - name: Publish
        if: steps.version.outputs.published != 'true'
        run: pnpm -F @thebkht/rtc-file-transfer publish --provenance --access public --no-git-checks

      # Runs after a skipped publish too, so re-running an old tag backfills a
      # missing release. An existing release is left as it is.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} already exists; leaving it."
            exit 0
          fi
          version=$(node -p "require('./packages/rtc-file-transfer/package.json').version")
          section=$(awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/rtc-file-transfer/CHANGELOG.md)
          if [ -z "$(printf '%s' "${section}" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no entries under '## ${version}'" >&2
            exit 1
          fi
          {
            echo "📦 https://www.npmjs.com/package/@thebkht/rtc-file-transfer"
            printf '%s\n' "${section}"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "@thebkht/rtc-file-transfer ${version}" \
            --notes-file release-notes.md
