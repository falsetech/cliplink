name: Release rtc-file-transfer

# Push a tag like `rtc-file-transfer@v0.1.0` after bumping the version in
# packages/rtc-file-transfer/package.json and its CHANGELOG.
on:
  push:
    tags:
      - "rtc-file-transfer@v*"

permissions:
  contents: read
  # npm trusted publishing and provenance: no long-lived NPM_TOKEN.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(node -p "require('./packages/rtc-file-transfer/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "rtc-file-transfer@v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          # A version can be published only once. Re-running on a tag that is
          # already on npm (0.1.0 was published by hand) verifies, then stops.
          if npm view "@thebkht/rtc-file-transfer@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@thebkht/rtc-file-transfer@${version} is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: pnpm -F @thebkht/rtc-file-transfer test

      - name: Build
        run: pnpm -F @thebkht/rtc-file-transfer build

      - name: Publish
        if: steps.version.outputs.published != 'true'
        run: pnpm -F @thebkht/rtc-file-transfer publish --provenance --access public --no-git-checks
