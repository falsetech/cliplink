name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package is tested and built on its own first: it is published, and
      # the tarball must not depend on the app compiling.
      - name: Test rtc-file-transfer
        run: pnpm -F @thebkht/rtc-file-transfer test

      - name: Build rtc-file-transfer
        run: pnpm -F @thebkht/rtc-file-transfer build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # Builds without Redis credentials: the app falls back to the in-memory
      # store, which is enough to compile and prerender.
      - name: Build
        run: pnpm build
