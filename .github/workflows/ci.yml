name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages are tested and built on their own first: they are
      # published, and a tarball must not depend on the app compiling.
      - name: Test rtc-file-transfer
        run: pnpm -F @thebkht/rtc-file-transfer test

      - name: Build rtc-file-transfer
        run: pnpm -F @thebkht/rtc-file-transfer build

      - name: Test cliplink
        run: pnpm -F @thebkht/cliplink test

      - name: Build cliplink
        run: pnpm -F @thebkht/cliplink build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # Builds without Redis credentials: the app falls back to the in-memory
      # store, which is enough to compile and prerender.
      - name: Build
        run: pnpm build
